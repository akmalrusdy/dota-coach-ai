[project]
name = "dota-coach"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.4", "httpx>=0.27", "openai>=1.40", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["dota_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
